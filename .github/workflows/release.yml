name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: termchat.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: termchat
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: termchat
          - os: macos-latest
            target: aarch64-apple-darwin
            executable: termchat
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package archive and checksum
        shell: pwsh
        run: |
          $archiveRoot = "termchat-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $archiveRoot | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" $archiveRoot
          Copy-Item README.md,LICENSE $archiveRoot
          Compress-Archive -Path $archiveRoot -DestinationPath "$archiveRoot.zip"
          (Get-FileHash "$archiveRoot.zip" -Algorithm SHA256).Hash.ToLower() + "  $archiveRoot.zip" | Set-Content "$archiveRoot.zip.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: termchat-${{ matrix.target }}
          path: |
            termchat-*.zip
            termchat-*.zip.sha256

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: termchat-*
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
