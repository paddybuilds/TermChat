[package]
name = "termchat-live"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "A lightweight, read-only terminal viewer for Twitch and Kick chat"
license = "MIT"
documentation = "https://docs.rs/termchat-live"
keywords = ["twitch", "kick", "chat", "terminal", "tui"]
categories = ["command-line-utilities"]

[[bin]]
name = "termchat"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["gif", "png", "webp"] }
lru = "0.16"
rand = "0.9"
ratatui = "0.30"
ratatui-image = { version = "11.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
twitch-irc = { version = "6.1", default-features = false, features = ["transport-tcp-rustls-native-roots"] }
unicode-width = "0.2"
url = "2.5"

[dev-dependencies]
tempfile = "3.23"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
